plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.samsungkeyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.samsungkeyboard"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}